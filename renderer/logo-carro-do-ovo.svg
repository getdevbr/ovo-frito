<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="carGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb400"/>
      <stop offset="100%" stop-color="#ff6c37"/>
    </linearGradient>
    <linearGradient id="eggGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffef9"/>
      <stop offset="100%" stop-color="#f7e3b5"/>
    </linearGradient>
  </defs>

  <!-- Megafone no teto (clássico Carro do Ovo) -->
  <path d="M18 14 L10 9 L10 19 Z" fill="#e63946" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="17" y="12" width="5" height="4" rx="1" fill="#adb5bd"/>
  <path d="M6 10 Q3 14 6 18" stroke="#ffb400" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M3 7 Q-1 14 3 21" stroke="#ff6c37" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Cabine / Para-brisa -->
  <path d="M16 34 L22 18 L48 18 L54 34 Z" fill="#2b2d42" stroke="#ffb400" stroke-width="2" stroke-linejoin="round"/>

  <!-- O OVO MOTORISTA dentro do carro -->
  <ellipse cx="36" cy="27" rx="9.5" ry="12" fill="url(#eggGrad)" stroke="#d4a373" stroke-width="1.5"/>
  <!-- Óculos escuros estilosos do Ovo -->
  <rect x="30" y="21" width="6" height="4" rx="1" fill="#111"/>
  <rect x="38" y="21" width="6" height="4" rx="1" fill="#111"/>
  <line x1="27" y1="22.5" x2="45" y2="22.5" stroke="#111" stroke-width="1.5"/>
  <!-- Sorriso do Ovo -->
  <path d="M33 28 Q36.5 31 40 28" stroke="#8d5524" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- Volante e mãozinha segurando -->
  <circle cx="44" cy="32" r="4.5" fill="none" stroke="#e5e5e5" stroke-width="2"/>
  <line x1="40" y1="29" x2="44" y2="31" stroke="#f7e3b5" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Lataria do Carro -->
  <rect x="6" y="33" width="52" height="16" rx="6" fill="url(#carGrad)" stroke="#fff" stroke-width="1.4"/>
  <!-- Farol dianteiro e traseiro -->
  <rect x="54" y="36" width="4" height="6" rx="2" fill="#fff3b0"/>
  <rect x="6" y="36" width="3" height="6" rx="1.5" fill="#e63946"/>
  <!-- Faixa lateral "OVO" -->
  <rect x="16" y="38" width="28" height="6" rx="3" fill="#1c1c1c" opacity="0.85"/>
  <text x="30" y="43" font-family="Arial, sans-serif" font-size="6.5" font-weight="900" fill="#ffb400" text-anchor="middle">OVO</text>

  <!-- Rodas -->
  <circle cx="19" cy="50" r="7.5" fill="#1c1c1c" stroke="#fff" stroke-width="1.5"/>
  <circle cx="19" cy="50" r="3" fill="#ffb400"/>
  <circle cx="46" cy="50" r="7.5" fill="#1c1c1c" stroke="#fff" stroke-width="1.5"/>
  <circle cx="46" cy="50" r="3" fill="#ffb400"/>
</svg>
